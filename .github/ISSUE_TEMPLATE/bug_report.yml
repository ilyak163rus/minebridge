name: Bug report
description: Something does not work as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please include a small Python program that reproduces the problem. Remove tokens and private information from logs."
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minebridge library/plugin, Python, Paper build and Java version.
      placeholder: "Minebridge 0.3.1, Python 3.14, Paper 26.2 build 133, Java 25"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Setup, the smallest Python example and steps to trigger the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Python traceback and relevant server log
      render: text

# For a LAN listener, change listenAddress to the server's numeric LAN address.
# Numeric IPv4/IPv6 only: binding never waits for DNS resolution.
listenAddress: '127.0.0.1'
port: 4711
# The primary Overworld is selected automatically, regardless of its folder name.
# Classroom default: clients connect with Minecraft.create(ip, port).
authEnabled: false
# Optional authentication. Set authEnabled: true and a nonblank token to require it.
# The string is preserved exactly, including surrounding spaces.
token: ''
